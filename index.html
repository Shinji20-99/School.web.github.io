<!DOCTYPE html>
<html>
<head>
<title>School Login</title>

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f4f6f9;
  font-family:Arial,sans-serif;
}

.container{
  width:320px;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
  text-align:center;
}

.logo{
  width:100px;
  height:100px;
  border-radius:50%;
  border:4px solid #004aad;
  object-fit:cover;
  margin-bottom:10px;
}

h2{
  color:#004aad;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#004aad;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#003080;
}

a{
  text-decoration:none;
  color:#004aad;
}

</style>
</head>

<body>

<div class="container">


  <img src="deped.png" class="logo" alt="School Logo">

  <h2>School Login</h2>

  <input id="email" placeholder="Email">

  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

</div>

<script type="module">
import { auth, db } from "./firebase.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.login = async () => {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    const q = query(
  collection(db, "users"),
  where("email", "==", email)
);

    const snap = await getDocs(q);

    console.log("Docs found:", snap.size);

    let role = "student";

    snap.forEach(doc => {
      role = doc.data().role;
      console.log(doc.data());
    });

    if (role === "admin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "student.html";
    }

  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};
</script>

</body>
</html>
